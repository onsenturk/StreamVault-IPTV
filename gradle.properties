org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Build performance. The project has four modules (:app :domain :data :player);
# :data and :player can build concurrently once :domain is done.
org.gradle.parallel=true
org.gradle.caching=true

# Configuration cache is deliberately NOT enabled yet: app/build.gradle.kts reads
# keystore.properties / local.properties and calls System.currentTimeMillis() at
# configuration time, which has to move behind providers first.

# Kotlin/KSP incremental compilation.
kotlin.incremental=true
ksp.incremental=true

# Only generate the per-module build features that are actually used. :data,
# :player and :domain reference no BuildConfig and declare no resValue/aidl/
# renderscript/shader sources; :app opts back in via buildFeatures.buildConfig.
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
